# ================================================================================
#              SUPABASE & DATABASE CONFIGURATION PROPERTIES
# ================================================================================

# --- Supabase REST API Settings (Recommended - Core Java 100% Zero-Dependency) ---
# Replace YOUR_PROJECT_REF and YOUR_SUPABASE_ANON_KEY with your actual Supabase credentials.
supabase.enabled=true
supabase.url=https://YOUR_PROJECT_REF.supabase.co
supabase.key=YOUR_SUPABASE_ANON_KEY

# --- PostgreSQL Direct JDBC Settings (Alternative Direct DB Connection) ---
db.jdbc.enabled=false
db.jdbc.url=jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres
db.jdbc.user=postgres
db.jdbc.password=YOUR_SUPABASE_DB_PASSWORD
db.jdbc.driver=org.postgresql.Driver

# --- Sync Configuration ---
db.sync.auto=true
db.batch.size=50
